[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "welearn-studio"
version = "0.1.2"
description = "A clean-room desktop workspace for user-controlled WeLearn tasks"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { name = "ww2186874-cyber" },
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Win32 (MS Windows)",
    "Programming Language :: Python :: 3.12",
]
dependencies = [
    "PySide6>=6.8,<7",
    "requests>=2.32,<3",
]

[project.optional-dependencies]
dev = [
    "build>=1.2,<2",
    "pyinstaller>=6.16,<7",
    "ruff>=0.12,<1",
]

[project.scripts]
welearn-studio = "welearn_studio.app:main"

[project.urls]
Repository = "https://github.com/ww2186874-cyber/Welearn_Studio"
Issues = "https://github.com/ww2186874-cyber/Welearn_Studio/issues"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B"]
ignore = ["E501"]
